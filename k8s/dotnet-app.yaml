apiVersion: v1
kind: Service
metadata:
  name: dotnet-app-service
  labels:
    app: dotnet-app
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: dotnet-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-app-deployment
  labels:
    app: dotnet-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dotnet-app
  template:
    metadata:
      labels:
        app: dotnet-app
    spec:
      containers:
        - name: dotnet-app
          image: kafka-dotnet-app:latest
          imagePullPolicy: IfNotPresent # Useful for running locally built Docker images in Minikube/Kind
          ports:
            - containerPort: 8080
          env:
            - name: Kafka__BootstrapServers
              value: "kafka-service:9092"
            - name: Kafka__Topic
              value: "dotnet-topic"
